---
- name: "create key file location"
  ansible.builtin.file:
    path: "{{lvm_key_dest}}"
    state: "directory"
    mode: "{{ lvm_key_dest_mode }}"
    owner: "root"
    group: "root"

- name: "create volume group and associate physical volumes"
  community.general.lvg:
    state: "present"
    vg: "{{vg}}"
    pvs: "{{pv}}"
  when: pv|default('') != ''

- ansible.builtin.include_tasks: "encfs.yml"

- ansible.builtin.include_tasks: "plain.yml"

- ansible.builtin.include_tasks: "metrics.yml"
  when: lvm_metrics_enabled | bool
