---
- name: "validate plain volume definition"
  ansible.builtin.fail:
    msg: "{{item.mnt}} is missing something"
  loop: "{{lvm_plain}}"
  loop_control:
    label: "volume - {{item.mnt}}"
  failed_when: >-
    item.size|default('') == '' or
    item.size|float == 0

- name: "check whether plain volume is already mounted"
  ansible.builtin.fail:
    msg: "{{item.mnt}} not mounted"
  register: mnt_check
  ignore_errors: true
  changed_when: false
  failed_when: >-
    (item.mnt_prefix | default(lvm_default_mnt_prefix)) + '/' + item.mnt
    not in ansible_facts['mounts'] | map(attribute='mount')
  loop: "{{lvm_plain}}"
  loop_control:
    label: "volume - {{item.mnt}}"

- name: "refuse to shrink an existing plain volume"
  ansible.builtin.fail:
    msg: "checking sizes of {{item.mnt}}"
  loop: "{{lvm_plain}}"
  loop_control:
    label: "volume - {{item.mnt}}"
  failed_when: >-
    item.mnt in ansible_facts['lvm']['lvs'] and
    (ansible_facts['lvm']['lvs'][item.mnt]['size_g'])|float
      > item.size|float

- name: "refuse to move a plain volume between volume groups"
  ansible.builtin.fail:
    msg: "checking volume group for {{item.mnt}}"
  failed_when: >-
    item.mnt in ansible_facts['lvm']['lvs'] and
    ansible_facts['lvm']['lvs'][item.mnt]['vg'] != vg
  loop: "{{lvm_plain}}"
  loop_control:
    label: "volume - {{item.mnt}}"

- name: "ensure plain logical volume"
  community.general.lvol:
    lv: "{{item.mnt}}"
    size: "{{item.size}}G"
    vg: "{{vg}}"
    shrink: false
  loop: "{{lvm_plain}}"
  loop_control:
    label: "volume - {{item.mnt}}"

- name: "ensure ext4 filesystem on plain volume"
  community.general.filesystem:
    dev: "/dev/{{vg}}/{{item.mnt}}"
    fstype: "ext4"
    resizefs: true
  loop: "{{lvm_plain}}"
  loop_control:
    label: "volume - {{item.mnt}}"

- name: "mount plain filesystem"
  ansible.posix.mount:
    boot: false
    fstype: "ext4"
    path: "{{item.item.mnt_prefix|default(lvm_default_mnt_prefix)}}/{{item.item.mnt}}"
    src: "/dev/{{vg}}/{{item.item.mnt}}"
    state: "mounted"
  loop: "{{mnt_check.results}}"
  loop_control:
    label: "volume - {{item.item.mnt}}"
