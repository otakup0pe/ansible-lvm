---
- name: Prepare
  hosts: all
  become: true
  gather_facts: true
  tasks:
    - name: Install storage prerequisites
      ansible.builtin.apt:
        name:
          - cryptsetup
          - e2fsprogs
          - lvm2
          - util-linux
        state: present
        update_cache: true
        cache_valid_time: 3600
      when: ansible_facts['os_family'] == "Debian"

    - name: Let LVM manage device nodes in the container
      ansible.builtin.copy:
        dest: /etc/lvm/lvm.conf
        mode: "0644"
        content: |
          activation {
              udev_rules = 0
              udev_sync = 0
          }

    - name: Ensure test storage directory exists
      ansible.builtin.file:
        path: /var/lib/molecule-lvm
        state: directory
        mode: "0700"

    - name: Create sparse physical-volume image
      ansible.builtin.command:
        cmd: truncate --size 3G /var/lib/molecule-lvm/pv.img
        creates: /var/lib/molecule-lvm/pv.img

    - name: Find attached test loop device
      ansible.builtin.command:
        cmd: losetup --associated /var/lib/molecule-lvm/pv.img
      register: molecule_existing_loop
      changed_when: false

    - name: Attach test loop device
      ansible.builtin.command:
        cmd: losetup --find --show /var/lib/molecule-lvm/pv.img
      register: molecule_attached_loop
      when: molecule_existing_loop.stdout | length == 0
      changed_when: true

    - name: Record test physical volume
      ansible.builtin.copy:
        dest: /var/lib/molecule-lvm/pv-device
        content: >-
          {{
            molecule_existing_loop.stdout.split(':')[0]
            if molecule_existing_loop.stdout | length > 0
            else molecule_attached_loop.stdout
          }}
        mode: "0600"
