---
name: Test

"on":
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lint-and-shell:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - name: Install shellcheck
        run: sudo apt-get update && sudo apt-get install --yes shellcheck
      - name: Run lint and shell tests
        run: make lint test-shell

  molecule:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target:
          - test-ubuntu2004
          - test-ubuntu2204
          - test-ubuntu2404
          - test-debian12
          - test-debian13
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - name: Run Molecule
        run: make ${{ matrix.target }}
