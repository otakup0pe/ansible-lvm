---
lvm_encfs: []
# - name: foo
#   mnt: /bar
#   size: '1G'
#   vg: asd
#   key: asdd
lvm_plain: []
lvm_crypt_suffix: 'crypto'
lvm_key_source: "{{ playbook_dir }}/files"
lvm_key_dest: "/var/cache/ansible-lvm"
lvm_key_dest_mode: "0400"
lvm_default_mnt_prefix: "/mnt"
lvm_metrics_enabled: false
lvm_metrics_textfile_dir: "/var/lib/node_exporter/textfile_collector"
lvm_metrics_script_dest: "/usr/local/bin/lvm-vg-metrics.sh"
lvm_metrics_interval: "5min"
lvm_metrics_expectations_dir: "/etc/lvm-vg-metrics.d"
lvm_metrics_expected_vgs: "{{ [vg] }}"
lvm_metrics_expected_plain_lvs: "{{ lvm_plain }}"
lvm_metrics_expected_encrypted_lvs: "{{ lvm_encfs }}"
